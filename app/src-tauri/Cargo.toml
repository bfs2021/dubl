[package]
name = "dubl"
version = "0.1.0"
description = "Дубль — любительский дубляж"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Тимур (pingvin1337) и участники проекта"]
homepage = "https://github.com/pingvin1337/dubl"
repository = "https://github.com/pingvin1337/dubl"
rust-version = "1.77"

[lib]
name = "dubl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
